name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://lasdosdoncellas-api.onrender.com/api/health) && echo "intento $i → $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
